<div class="flex flex-col gap-3">
  <input
    type="search"
    placeholder="Search by name or city…"
    class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-teal-600 focus:outline-none"
    (input)="onSearch($event)"
  />

  @if (filteredStations().length === 0) {
    <p class="py-4 text-center text-sm text-slate-500">No stations match your search.</p>
  }

  <ul class="flex max-h-[60vh] flex-col gap-2 overflow-y-auto pr-1">
    @for (station of filteredStations(); track station.id) {
      <li>
        <button
          type="button"
          class="w-full rounded-lg border border-slate-200 bg-white p-3 text-left shadow-sm transition hover:border-teal-600 hover:shadow"
          (click)="stationSelected.emit(station)"
        >
          <span class="block font-medium text-slate-800">{{ station.designation }}</span>
          <span class="block text-sm text-slate-500">
            {{ station.address.street }}, {{ station.address.zip }} {{ station.address.city }}
          </span>
          <span class="mt-1 flex flex-wrap gap-1">
            @for (fuelType of station.fuelTypes; track fuelType.id) {
              <span class="rounded bg-teal-50 px-1.5 py-0.5 text-xs font-medium text-teal-800">
                {{ fuelType.abbreviation }}
              </span>
            }
          </span>
        </button>
      </li>
    }
  </ul>
</div>
