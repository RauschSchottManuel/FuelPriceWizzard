<h1 class="mb-4 text-2xl font-semibold text-slate-800">Gas stations</h1>

@if (store.error(); as error) {
  <div class="mb-4 flex items-center justify-between rounded-lg border border-red-300 bg-red-50 px-4 py-3 text-red-800">
    <span>{{ error }}</span>
    <button
      type="button"
      class="rounded bg-red-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-red-700"
      (click)="retry()"
    >
      Retry
    </button>
  </div>
}

@if (store.loading()) {
  <p class="mb-4 animate-pulse text-slate-500">Loading gas stations…</p>
}

<div class="flex flex-col gap-6 lg:flex-row">
  <div class="lg:w-3/5">
    @if (markers().length > 0) {
      <app-osm-map
        width="100%"
        height="60vh"
        [markerLatLongs]="markers()"
        (markerClicked)="openStation($event)"
      />
    } @else if (!store.loading() && !store.error()) {
      <div class="flex h-64 items-center justify-center rounded-lg border border-slate-300 bg-white text-slate-500">
        No stations with coordinates to display.
      </div>
    }
  </div>
  <div class="lg:w-2/5">
    <app-station-list [stations]="store.stations()" (stationSelected)="openStation($event)" />
  </div>
</div>
