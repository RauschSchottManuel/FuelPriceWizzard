name: Deploy UI
on:
    push:
      branches: [main]
      paths:
        - 'FuelPriceWizard.UI/fuelpricewizard/**'
    workflow_dispatch:   # manual deploys from the Actions tab

env:
  IMAGE: registry.mrausch-schott.com/fuelpricewizard-ui

jobs:
  build-push-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # buildx on GitHub runners uses the docker-container driver,
      # which pushes OCI media types — exactly what zot requires.
      - uses: docker/setup-buildx-action@v3

      # The registry requires authentication for pushes. Add REGISTRY_USERNAME
      # and REGISTRY_PASSWORD as repository secrets (Settings → Secrets → Actions).
      - uses: docker/login-action@v3
        with:
          registry: registry.mrausch-schott.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: FuelPriceWizard.UI/fuelpricewizard
          push: true
          provenance: false        # single OCI manifest, no attestation index
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      #- name: Scan before release
